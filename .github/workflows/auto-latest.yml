name: Publish latest version

on:
  push:
    branches: [main]
    paths:
      - 'index_v*.html'
      - 'parent_v*.html'
      - '.github/workflows/auto-latest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update published HTML files from latest versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for prefix, target in [('index', 'index.html'), ('parent', 'parent.html')]:
              versions = []
              for path in Path('.').glob(f'{prefix}_v*.html'):
                  match = re.fullmatch(rf'{prefix}_v([0-9]+)\.html', path.name)
                  if match:
                      versions.append((int(match.group(1)), path))
              if not versions:
                  if prefix == 'parent':
                      print('No parent version found; skipping parent.html')
                      continue
                  raise SystemExit('No index_vN.html files found')
              number, latest = max(versions)
              Path(target).write_bytes(latest.read_bytes())
              print(f'Published {latest.name} as {target} (version {number})')
          PY
      - name: Commit published HTML files if changed
        run: |
          git add index.html parent.html
          if git diff --cached --quiet; then
            echo 'Published pages already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: publish latest app version [skip ci]'
          git push

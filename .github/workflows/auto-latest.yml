name: Publish latest version

on:
  push:
    branches: [main]
    paths:
      - 'index_v*.html'
      - '.github/workflows/auto-latest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update index.html from highest numbered version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          versions = []
          for path in Path('.').glob('index_v*.html'):
              match = re.fullmatch(r'index_v([0-9]+)\.html', path.name)
              if match:
                  versions.append((int(match.group(1)), path))
          if not versions:
              raise SystemExit('No index_vN.html files found')
          number, latest = max(versions)
          Path('index.html').write_bytes(latest.read_bytes())
          print(f'Published {latest.name} as index.html (version {number})')
          PY
      - name: Commit index.html if changed
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: publish latest app version [skip ci]'
          git push

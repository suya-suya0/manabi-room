<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f7"><link rel="manifest" href="./subaru-child.webmanifest"><link rel="apple-touch-icon" href="./parent-icon-192.png"><title>すばる｜子ども用</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#31533b;background:#fff8f7}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:15px;padding:13px 17px;color:#315b3c;background:#e3edcf;font-weight:700}button:focus-visible,input:focus-visible{outline:3px solid #b27296;outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}.pink{background:#f5dce7}.yellow{background:#fff0c4}.green{background:#e1efcd}.muted{color:#6e786d;font-size:13px}.small{font-size:13px}.wrap{max-width:620px;margin:0 auto;padding:18px 17px 36px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.brand{font-size:27px;font-weight:850;white-space:nowrap;letter-spacing:.01em}.brand span{color:#c780a1}.head-actions{display:flex;gap:6px}.head-actions button{font-size:12px;padding:9px 11px}.card{background:white;border:1px solid #f0e4e8;border-radius:25px;padding:22px;margin:14px 0;box-shadow:0 3px 16px #493a4406}.card h2{font-size:21px;margin:0 0 12px}.card h3{margin:4px 0 12px;font-size:18px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:18px 0}.tile{display:flex;min-height:162px;padding:18px 14px;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;color:#315b3c}.tile .ico{font-size:29px}.tile .label{font-size:19px;line-height:1.3}.tile .desc{font-size:12px;font-weight:500;opacity:.85;line-height:1.5}.back{background:#f7ecf1;margin:5px 0 15px}label{display:block;margin:12px 0 6px;font-weight:700}input,select,textarea{width:100%;border:1px solid #e7ccd7;border-radius:13px;padding:12px 13px;background:#fff;color:#34483a}form button{margin-top:15px}.note{font-size:13px;color:#6e786d;line-height:1.7}.err{padding:13px;border-radius:13px;background:#fff0ef;color:#a63a4b;margin:10px 0}.ok{padding:13px;border-radius:13px;background:#e2f3e6;color:#236446;margin:10px 0}.hidden{display:none!important}.line{height:1px;background:#eee1e8;margin:15px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{border-radius:100px;padding:7px 12px;background:#e1efcd;font-weight:800;color:#2b704c}.status-外出中{background:#fff0c4;color:#92651b}.status-未到着,.status-欠席{background:#f5dce7;color:#97546b}.status-退室済み{background:#eee8ed;color:#666}.checks{background:#fff2c9;border-radius:25px;padding:23px 21px;margin-top:14px}.checks h2{color:#356242}.check{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;color:#1e3123}.check input{appearance:none;width:24px;height:24px;min-width:24px;border:1.5px solid #bbcad0;border-radius:50%;margin:0;padding:0;background:transparent}.check input:checked{background:#75a67d;border-color:#75a67d;box-shadow:inset 0 0 0 5px #fff2c9}.diary{background:#fff;margin:12px 0;padding:16px;border-radius:16px;border:1px solid #ecdee6;white-space:pre-wrap;line-height:1.8}body.dark{background:#1e2424;color:#e8f0e7}body.dark .brand,body.dark .tile{color:#dff0df}body.dark .card,body.dark .diary{background:#303638;border-color:#46504a;color:#f0f4ed}body.dark .tile.green{background:#344e41}body.dark .tile.pink{background:#614557}body.dark .tile.yellow,body.dark .checks{background:#5a523a;color:#f2eedb}body.dark .checks h2,body.dark .check{color:#f2eedb}body.dark input,body.dark textarea,body.dark select{background:#252b2c;color:white;border-color:#526157}body.dark .note,body.dark .muted{color:#bfc8ba}
</style></head><body><div class="wrap"><header class="head"><div class="brand"><span>✿</span> すばる</div><div class="head-actions"><button id="home" class="pink hidden">ホーム</button><button id="signout" class="hidden">ログアウト</button></div></header><div id="notice"></div><main id="app"><section class="card">接続中…</section></main></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './manabi-config.js';
// 子ども用は保護者・先生と認証情報を混ぜない独立のストレージキー。
const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'subaru-child-session-v1',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const subjects=['国語','数学','理科','社会','英語','その他'];
const tasks=['スマホを置いて過ごす','紙の本を15分読む','空や風景をぼんやり眺める','何も聴かずに散歩する','手を使って何かをつくる','寝る前は画面を見ない'];
const grades=['小4','小5','小6','中1','中2','中3'];
let user=null,request=null,link=null,student=null,study=[],progress=[],diary=[],checks=[],tab='home',recovery=false;
const day=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function notice(msg='',error=false){$('notice').innerHTML=msg?`<div class="${error?'err':'ok'}" role="status">${esc(msg)}</div>`:''}
function back(){const b=$('goBack');if(b)b.onclick=()=>{tab='home';render()}}
function signedOut(){user=null;$('home').classList.add('hidden');$('signout').classList.add('hidden');loginScreen()}
function loginScreen(register=false){$('app').innerHTML=`<section class="card"><h2>${register?'子ども用の新規登録':'子ども用ログイン'}</h2><p class="note">保護者とは別のメールアドレス・パスワードでログインします。初めてのときは先生の承認が必要です。</p><div class="row"><button id="loginTab" class="${register?'':'pink'}">ログイン</button><button id="registerTab" class="${register?'pink':''}">新規登録</button></div><form id="authForm">${register?`<label>自分の本名（姓・名）</label><input name="name" required maxlength="100" placeholder="例：田中 太郎"><label>学年</label><select name="grade">${grades.map(g=>`<option>${g}</option>`).join('')}</select>`:''}<label>メールアドレス</label><input name="email" type="email" autocomplete="email" required><label>パスワード</label><input name="password" type="password" minlength="8" autocomplete="${register?'new-password':'current-password'}" required><button type="submit">${register?'新規登録して申請する':'ログイン'}</button></form>${!register?'<p><button id="forgot" class="pink">パスワードを忘れた方</button></p>':''}</section>`;
$('loginTab').onclick=()=>loginScreen(false);$('registerTab').onclick=()=>loginScreen(true);if($('forgot'))$('forgot').onclick=forgotScreen;
$('authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')).trim(),password=String(f.get('password'));try{if(register){const name=String(f.get('name')).trim();if(!/[ 　]/.test(name))throw new Error('姓と名を入力してください');const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:new URL('./child.html',location.href).href,data:{subaru_child_name:name,subaru_child_grade:String(f.get('grade'))}}});if(error)throw error;sessionStorage.setItem('subaru-child-pending',JSON.stringify({name,grade:f.get('grade'),email}));if(data.session){user=data.user;await start()}else{loginScreen(false);notice('確認メールが届いたらリンクを開いてログインしてください。同じ端末で申請が完了します。')}}else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await start()}}catch(ex){notice(ex.message,true)}}}
async function submitPending(){
  if(!user)return;
  // メール確認リンクを別ブラウザで開いても、登録時の氏名と学年を復元できる。
  const metadata=user.user_metadata||{};
  let pending=null;
  try{pending=JSON.parse(sessionStorage.getItem('subaru-child-pending')||'null')}catch(_){pending=null}
  const p=pending?.email?.toLowerCase()===user.email?.toLowerCase()?pending:
    (metadata.subaru_child_name&&metadata.subaru_child_grade?{name:metadata.subaru_child_name,grade:metadata.subaru_child_grade}:null);
  if(!p)return;
  const {data:existing,error:queryError}=await db.from('manabi_child_requests').select('id').eq('child_user_id',user.id).limit(1);
  if(queryError)throw queryError;
  if(!existing?.length){
    const {error}=await db.from('manabi_child_requests').insert({child_user_id:user.id,child_name:p.name,grade:p.grade});
    if(error)throw new Error('子ども登録申請を保存できませんでした：'+error.message);
  }
  sessionStorage.removeItem('subaru-child-pending');
}
async function manualChildRequest(){
  base(`<section class="card"><h2>先生への登録申請</h2><p class="note">アカウントの登録はできていますが、先生への申請がまだ届いていません。お名前と学年を入力して送信してください。</p><form id="manualRequestForm"><label>自分の本名（姓・名）</label><input name="child_name" maxlength="100" required placeholder="例：田中 太郎"><label>学年</label><select name="grade">${grades.map(g=>`<option value="${g}">${g}</option>`).join('')}</select><button type="submit">先生に登録申請を送る</button></form></section>`);
  $('manualRequestForm').onsubmit=async e=>{
    e.preventDefault();const form=e.currentTarget,f=new FormData(form),name=String(f.get('child_name')||'').trim(),grade=String(f.get('grade')||'');
    if(!/\S+[ 　]+\S+/.test(name)){notice('姓名を空白で区切って入力してください',true);return}
    const button=form.querySelector('button');button.disabled=true;
    try{
      const {error}=await db.from('manabi_child_requests').insert({child_user_id:user.id,child_name:name,grade});
      if(error)throw error;
      await db.auth.updateUser({data:{subaru_child_name:name,subaru_child_grade:grade}});
      await load();render();notice('先生への登録申請を送信しました。承認をお待ちください。');
    }catch(ex){notice('申請を送信できませんでした：'+(ex.message||ex),true)}finally{button.disabled=false}
  };
}
async function load(){let r=await Promise.all([db.from('manabi_child_links').select('*').eq('child_user_id',user.id).maybeSingle(),db.from('manabi_child_requests').select('*').eq('child_user_id',user.id).order('created_at',{ascending:false}).limit(1)]);for(const x of r)if(x.error)throw x.error;link=r[0].data;request=r[1].data?.[0]||null;student=null;study=[];progress=[];diary=[];checks=[];if(!link)return;r=await Promise.all([db.from('manabi_students').select('id,name,grade,status,status_at').eq('id',link.student_id).maybeSingle(),db.from('manabi_study').select('subject,pages,created_at').eq('student_id',link.student_id).order('created_at',{ascending:false}).limit(50),db.from('manabi_diary').select('body,created_at').order('created_at',{ascending:false}).limit(30),db.from('manabi_child_checks').select('item_index,checked').eq('child_user_id',user.id).eq('check_date',day())]);for(const x of r)if(x.error)throw x.error;student=r[0].data;study=r[1].data||[];diary=r[2].data||[];checks=r[3].data||[];const p=await db.from('manabi_school_progress').select('subject,details').eq('student_id',link.student_id);if(!p.error)progress=p.data||[]}
async function start(){
  try{
    // 未ログインは異常ではない。まずセッションの有無を確認する。
    const {data:sessionData,error:sessionError}=await db.auth.getSession();
    if(sessionError){
      if(/auth session missing|session missing/i.test(sessionError.message||'')){
        signedOut();notice();return;
      }
      throw sessionError;
    }
    if(!sessionData?.session){signedOut();notice();return;}
    const {data:userData,error:userError}=await db.auth.getUser();
    if(userError){
      if(/auth session missing|session missing|invalid refresh token|refresh token not found/i.test(userError.message||'')){
        await db.auth.signOut({scope:'local'});
        signedOut();notice('ログイン情報の有効期限が切れました。再度ログインしてください。');return;
      }
      throw userError;
    }
    user=userData?.user||null;
    if(!user){signedOut();notice();return;}
    await submitPending();
    await load();
    $('signout').classList.remove('hidden');$('home').classList.remove('hidden');
    $('home').onclick=()=>{tab='home';render()};
    $('signout').onclick=async()=>{await db.auth.signOut();signedOut();notice('ログアウトしました')};
    render();notice();
  }catch(e){
    notice(e?.message||'読み込み中にエラーが発生しました',true);
    $('app').innerHTML='<section class="card"><h2>読み込みに失敗しました</h2><p class="note">通信状態を確認してください。ログイン情報がない場合はログイン画面に戻れます。</p><button id="retry">再確認する</button> <button id="goLogin" class="pink">ログイン画面へ</button></section>';
    $('retry').onclick=start;
    $('goLogin').onclick=()=>{signedOut();notice()};
  }
}
function base(html){$('app').innerHTML=html;back()}
function home(){const status=student?.status||'未到着',dt=student?.status_at?new Date(student.status_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';base(`<section class="card"><div class="muted">あなたの在室状況</div><h2>${esc(student.name)}（${esc(student.grade)}）</h2><div class="row"><span class="pill status-${esc(status)}">${esc(status)}</span><span class="muted">更新：${esc(dt)}</span></div><div class="line"></div><h3>最近の学習記録</h3>${study.slice(0,4).map(x=>`<div class="row" style="padding:8px 0"><span>${esc(x.subject)}　${Number(x.pages)}ページ</span><small class="muted">${esc(new Date(x.created_at).toLocaleDateString('ja-JP'))}</small></div>`).join('')||'<p class="note">まだ学習記録はありません。</p>'}</section><div class="tiles"><button class="tile green" data-tab="study"><span class="ico">▤</span><span class="label">学習記録</span><span class="desc">取り組んだ科目とページ数</span></button><button class="tile pink" data-tab="progress"><span class="ico">▣</span><span class="label">学校の進度</span><span class="desc">学校で今どこまで進んでいるか</span></button><button class="tile yellow" data-tab="brain"><span class="ico">☘</span><span class="label">脳のすき間を<br>あける時間</span><span class="desc">少しだけ画面から離れる</span></button><button class="tile green" data-tab="diary"><span class="ico">✎</span><span class="label">先生の<br>ひとこと日記</span><span class="desc">先生からのメッセージ</span></button></div><div class="row"><button class="pink" data-tab="settings">設定</button><button id="reload">情報を更新</button></div>`);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('reload').onclick=async()=>{await load();render();notice('最新情報に更新しました')}}
function studyPage(){base(`<button class="back" id="goBack">← ホーム</button><section class="card"><h2>学習記録</h2>${study.map(x=>`<div class="row" style="padding:10px 0"><strong>${esc(x.subject)}　${Number(x.pages)}ページ</strong><small class="muted">${esc(new Date(x.created_at).toLocaleDateString('ja-JP'))}</small></div>`).join('')||'<p>まだ記録はありません。</p>'}</section>`)}
function progressPage(){base(`<button class="back" id="goBack">← ホーム</button><section class="card"><h2>学校の進度</h2><p class="note">保護者の方が記録した学校の進度を確認できます。</p>${progress.map(x=>`<div class="diary"><b>${esc(x.subject)}</b><p>${esc(x.details)}</p></div>`).join('')||'<p>まだ進度は記録されていません。</p>'}</section>`)}
function brainPage(){const checked=new Set(checks.filter(x=>x.checked).map(x=>x.item_index));base(`<button class="back" id="goBack">← ホーム</button><section class="checks"><h2>🌿 脳のすき間をあける時間</h2><p class="note">情報を入れるばかりではなく、何も入れない時間も大切に。</p>${tasks.map((t,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${checked.has(i)?'checked':''}><span>${esc(t)}</span></label>`).join('')}<div class="line" style="background:#ddd1ac"></div><p style="text-align:center;font-size:13px">何もしない時間から、何かが生まれる。</p><p class="note" style="text-align:center">チェックは今日の日付で保存されます。全部できなくても大丈夫。</p></section>`);document.querySelectorAll('[data-check]').forEach(c=>c.onchange=async()=>{const index=Number(c.dataset.check),isChecked=c.checked;c.disabled=true;try{const q=isChecked?await db.from('manabi_child_checks').upsert({child_user_id:user.id,check_date:day(),item_index:index,checked:true},{onConflict:'child_user_id,check_date,item_index'}):await db.from('manabi_child_checks').delete().eq('child_user_id',user.id).eq('check_date',day()).eq('item_index',index);if(q.error)throw q.error;await load();notice('チェックを保存しました')}catch(e){c.checked=!isChecked;notice(e.message,true)}finally{c.disabled=false}})}
function diaryPage(){base(`<button class="back" id="goBack">← ホーム</button><section class="card"><h2>先生のひとこと日記</h2><p class="note">先生から、みんなへのひとこと。</p>${diary.map(d=>`<article class="diary"><small class="muted">${esc(new Date(d.created_at).toLocaleDateString('ja-JP'))}</small><div>${esc(d.body)}</div></article>`).join('')||'<p>まだ日記の投稿はありません。</p>'}</section>`)}
function settingsPage(){base(`<button class="back" id="goBack">← ホーム</button><section class="card"><h2>設定</h2><p class="note">ログイン中：${esc(user.email)}</p><label class="check"><input type="checkbox" id="dark" ${document.body.classList.contains('dark')?'checked':''}><span>ダークモード</span></label><button class="pink" id="changePass">パスワードを変更する</button></section>`);$('dark').onchange=e=>{document.body.classList.toggle('dark',e.target.checked);localStorage.setItem('subaru-child-dark',e.target.checked?'1':'0')};$('changePass').onclick=()=>resetScreen(true)}
function resetScreen(signedIn=false){base(`<section class="card"><h2>新しいパスワード</h2><form id="passwordForm"><label>新しいパスワード（8文字以上）</label><input type="password" id="pass1" minlength="8" required><label>もう一度入力</label><input type="password" id="pass2" minlength="8" required><button>変更する</button></form></section>`);$('passwordForm').onsubmit=async e=>{e.preventDefault();if($('pass1').value!==$('pass2').value){notice('パスワードが一致しません',true);return}const {error}=await db.auth.updateUser({password:$('pass1').value});if(error){notice(error.message,true);return}history.replaceState({},'',location.pathname);recovery=false;notice('パスワードを更新しました');tab='home';await start()}}
function forgotScreen(){base(`<section class="card"><h2>パスワードを忘れた方</h2><form id="forgotForm"><label>登録したメールアドレス</label><input id="forgotEmail" type="email" required><button>再設定メールを送信</button></form><p><button class="back" id="backLogin">ログイン画面に戻る</button></p></section>`);$('backLogin').onclick=()=>loginScreen();$('forgotForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.resetPasswordForEmail($('forgotEmail').value.trim(),{redirectTo:new URL('./child.html',location.href).href});if(error)notice(error.message,true);else notice('再設定メールの送信を受け付けました')}}
function render(){if(!user){loginScreen();return}if(!link){base(`<section class="card"><h2>先生の承認待ち</h2><p>子ども用の登録申請を先生が確認しています。</p>${request?`<p>申請：${esc(request.child_name)}（${esc(request.grade)}）</p><p>状態：${esc(request.state)}</p>`:'<p class="note">先生への登録申請がまだ送信されていません。</p>'}${!request?'<button class="pink" id="completeRequest">登録申請を送る</button>':''}<button id="reload">再確認する</button></section>`);$('reload').onclick=start;if($('completeRequest'))$('completeRequest').onclick=manualChildRequest;return}if(!student){base('<section class="card">生徒情報を確認できません。先生にご確認ください。</section>');return}({home,study:studyPage,progress:progressPage,brain:brainPage,diary:diaryPage,settings:settingsPage}[tab]||home)()}
const dark=localStorage.getItem('subaru-child-dark')==='1';document.body.classList.toggle('dark',dark);
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;setTimeout(()=>resetScreen(),0)}});
start();
</script></body></html>

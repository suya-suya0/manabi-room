<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まなび管理室｜管理者 v15</title><link rel="stylesheet" href="./manabi-style.css"><style>
/* 今日の生徒追加：既存のD案デザインに合わせたモーダル */
.manabi-add-backdrop{position:fixed;inset:0;background:rgba(31,27,34,.52);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}
.manabi-add-dialog{width:min(560px,100%);max-height:min(84vh,760px);overflow:auto;background:var(--card,#fff);background-color:#fff;color:#422f3b;border:1px solid #efd5df;border-radius:20px;box-shadow:0 18px 55px rgba(37,17,30,.22);padding:24px}
body.dark .manabi-add-dialog{background:#24242b;color:#f5edf2;border-color:#52505a}
.manabi-add-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.manabi-add-head h2{margin:0;font-size:1.3rem}
.manabi-add-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:15px}
.manabi-add-grade,.manabi-add-person{width:100%;padding:14px 12px;min-height:52px;text-align:left;border:1px solid #edccda;background:#fff6f9;color:#713e55;border-radius:12px;font-size:1rem;cursor:pointer}
.manabi-add-grade{text-align:center;font-weight:700}
.manabi-add-grade:hover,.manabi-add-person:hover{background:#f2d7e2}
.manabi-add-person{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}
.manabi-add-person small{display:block;font-size:.78rem;opacity:.8;margin-top:3px}
.manabi-add-person span:last-child{font-weight:700;white-space:nowrap}
.manabi-add-empty{padding:22px 8px;color:#795d6b}
.manabi-add-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.manabi-add-top .neutral{white-space:nowrap}
.manabi-add-meta{color:#826d7a;font-size:.9rem}
body.dark .manabi-add-grade,body.dark .manabi-add-person{background:#38313b;color:#f9edf2;border-color:#6c5364}
body.dark .manabi-add-grade:hover,body.dark .manabi-add-person:hover{background:#514050}
body.dark .manabi-add-meta,body.dark .manabi-add-empty{color:#c9b9c2}
@media(max-width:490px){.manabi-add-dialog{padding:17px}.manabi-add-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* v11: 生徒編集ダイアログ */
.manabi-edit-backdrop{position:fixed;inset:0;background:rgba(31,27,34,.55);z-index:1100;display:flex;align-items:center;justify-content:center;padding:18px}
.manabi-edit-dialog{box-sizing:border-box;width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;color:#422f3b;border:1px solid #efd5df;border-radius:20px;box-shadow:0 18px 55px rgba(37,17,30,.22);padding:24px}
.manabi-edit-dialog label{display:block;margin:13px 0 5px;font-weight:650}
.manabi-edit-dialog input,.manabi-edit-dialog select{box-sizing:border-box;width:100%}
.manabi-edit-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
body.dark .manabi-edit-dialog{background:#24242b;color:#f5edf2;border-color:#52505a}
@media(max-width:490px){.manabi-edit-dialog{padding:18px}}

/* v14 生徒管理：折りたたみ対応 */
.manabi-register-heading{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 14px}
.manabi-register-heading h3{margin:0}.manabi-register-heading h3 small{font-size:.8em;font-weight:500;opacity:.7}
.manabi-register-heading label{font-size:.9rem}.manabi-register-heading input{width:min(260px,100%);margin:0}
.manabi-grade-list{display:grid;gap:12px}
.manabi-grade-group{border:1px solid #edd4df;border-radius:15px;overflow:hidden;background:rgba(255,255,255,.65)}
.manabi-grade-group summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#f8e6ed;font-weight:700;color:#75445c;list-style:none}
.manabi-grade-group summary::-webkit-details-marker{display:none}
.manabi-grade-group summary small{font-size:.87rem;font-weight:500}
.manabi-grade-members{padding:8px 12px}.manabi-grade-members .entry{margin:6px 0}
.manabi-register-name{min-width:130px}.manabi-no-member{padding:4px 8px;color:#8d7780;font-size:.9rem}
body.dark .manabi-grade-group{background:#2e2930;border-color:#5c4b55}
body.dark .manabi-grade-group summary{background:#493742;color:#f8eaf1}
@media(max-width:600px){.manabi-register-heading{align-items:stretch;flex-direction:column}.manabi-register-heading input{width:100%}}

/* すばる共通パレット：保護者・子ども用と統一した低彩度の配色 */
body:not(.dark){background:#fff9f9;color:#344c3c}
body:not(.dark) .brand{color:#315f3c;white-space:nowrap}
body:not(.dark) .sub,body:not(.dark) .tiny,body:not(.dark) .muted{color:#677769}
body:not(.dark) .card,body:not(.dark) .side{background:#fff;border:1px solid #efe6e6;box-shadow:0 6px 24px rgba(72,89,64,.045);border-radius:23px}
body:not(.dark) .menu{gap:10px}
body:not(.dark) .menu button{border:1px solid transparent;border-radius:14px;color:#31563b;background:#e1efcd;padding:14px 15px;transition:filter .15s,background .15s}
body:not(.dark) .menu button:nth-child(3n + 2){background:#f5dce7}
body:not(.dark) .menu button:nth-child(3n){background:#fff0c4}
body:not(.dark) .menu button.active{border-color:#679177;box-shadow:inset 3px 0 0 #4e795a;font-weight:800;filter:saturate(1.08)}
body:not(.dark) button:not(.secondary):not(.neutral):not(.danger):not(.manabi-add-grade):not(.manabi-add-person){background:#477655;color:#fff}
body:not(.dark) button.secondary{background:#f5dce7;color:#6c4657}
body:not(.dark) button.neutral{background:#e1efcd;color:#31563b}
body:not(.dark) .stat{background:#e1efcd;color:#31563b;border-radius:18px}
body:not(.dark) .stat:nth-child(2){background:#fff0c4}
body:not(.dark) .stat:nth-child(3){background:#f5dce7}
body:not(.dark) .flash{background:#f5dce7;color:#495f4d}
body:not(.dark) .flash.ok{background:#e6f3df;color:#285a37}
body:not(.dark) .flash.error{background:#ffe8e8;color:#9d344a}
body:not(.dark) input,body:not(.dark) select,body:not(.dark) textarea{border-color:#dfd9d9}
body:not(.dark) .manabi-grade-group{background:#fff;border:1px solid #dce7d8;border-radius:18px}
body:not(.dark) .manabi-grade-group:nth-child(3n+1) summary{background:#e1efcd;color:#31563b}
body:not(.dark) .manabi-grade-group:nth-child(3n+2) summary{background:#f5dce7;color:#70485a}
body:not(.dark) .manabi-grade-group:nth-child(3n) summary{background:#fff0c4;color:#675331}
.manabi-grade-group summary{min-height:55px;gap:12px}
.manabi-grade-group summary::after{content:'⌄';font-size:23px;line-height:1;transition:transform .15s;flex:none}
.manabi-grade-group[open] summary::after{transform:rotate(180deg)}
.manabi-grade-group summary:focus-visible{outline:3px solid #66906e;outline-offset:-3px}
.manabi-collapse-actions{display:flex;gap:7px;flex-wrap:wrap}
.manabi-collapse-actions button{padding:8px 11px;font-size:13px;min-height:36px}
body.dark .manabi-grade-group summary::after{color:#f8eaf1}
body.dark .manabi-grade-group{border-color:#5c4b55}
@media(max-width:700px){.manabi-collapse-actions{order:3}.manabi-register-heading label{width:100%}}

/* v15：8つのナビゲーションボタンを柔らかなパステルで色分け。
   通常ボタンの汎用セレクタに上書きされないよう、より具体的なセレクタを使用。 */
body:not(.dark) .side .menu button {
  color:#31563b !important;
  border:1px solid rgba(63,93,68,.13);
  box-shadow:none;
  font-weight:750;
  min-height:56px;
  text-align:left;
}
body:not(.dark) .side .menu button:nth-child(3n + 1){background:#e1efcd !important;color:#31563b !important}
body:not(.dark) .side .menu button:nth-child(3n + 2){background:#f5dce7 !important;color:#70485a !important}
body:not(.dark) .side .menu button:nth-child(3n){background:#fff0c4 !important;color:#65512b !important}
body:not(.dark) .side .menu button.active {
  border:2px solid #678775;
  box-shadow:0 0 0 2px rgba(103,135,117,.12);
}
body:not(.dark) .side .menu button:hover{filter:brightness(.97)}
body:not(.dark) .side .menu button:focus-visible{outline:3px solid #537d60;outline-offset:2px}
.manabi-pw-panel{border:1px solid #e7e0df;border-radius:16px;padding:18px;margin-top:22px}
.manabi-pw-panel h3{margin-bottom:6px}
.manabi-pw-panel .manabi-pw-fields{display:grid;gap:7px;max-width:460px}
.manabi-pw-panel .manabi-pw-fields label{margin-top:8px}
.manabi-pw-panel button{margin-top:12px}
body.dark .manabi-pw-panel{border-color:#57515b}

/* v16 生徒詳細：学校の進度・学習記録を一画面で確認 */
.manabi-detail-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.manabi-detail-actions{display:flex;gap:9px;flex-wrap:wrap}
.manabi-detail-profile{border-radius:18px;padding:19px;background:#e1efcd;color:#31563b;margin-bottom:16px}
.manabi-detail-profile h2{margin:5px 0 8px}
.manabi-detail-profile .tiny{color:#48654d}
.manabi-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.manabi-detail-panel{border:1px solid #e8e5e2;border-radius:17px;padding:17px;min-width:0}
.manabi-detail-panel h3{margin:0 0 12px}
.manabi-progress-item{padding:11px 0;border-bottom:1px solid #e7e7e0}
.manabi-progress-item:last-child{border-bottom:none}
.manabi-progress-item p{margin:7px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.manabi-detail-tag{display:inline-block;padding:4px 10px;border-radius:30px;background:#f5dce7;color:#644353;font-size:13px;font-weight:700}
.manabi-detail-studyrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e7e7e0}
.manabi-detail-studyrow:last-child{border-bottom:none}
.manabi-detail-studyrow .tiny{white-space:nowrap}
body.dark .manabi-detail-profile{background:#354c3d;color:#f4fff5}
body.dark .manabi-detail-profile .tiny{color:#d1dfd2}
body.dark .manabi-detail-panel{border-color:#625763}
body.dark .manabi-progress-item,body.dark .manabi-detail-studyrow{border-color:#625763}
body.dark .manabi-detail-tag{background:#624858;color:#ffe7f3}
@media(max-width:980px){.manabi-detail-grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">✿ まなび管理室</div><div class="sub">先生用・管理画面</div></div><button id="logout" class="neutral hidden">ログアウト</button></header><div id="message" class="flash" role="status">接続準備中…</div><main id="app"></main></div><script>
// 初期化の失敗を「接続準備中…」のままにしないための診断表示
(function(){
 function show(message){
  const el=document.getElementById('message');
  if(!el)return;
  if(el.textContent.includes('接続準備中')){
   el.textContent='起動エラー：'+message+'（ページを再読み込みしても続く場合、この表示を教えてください）';
   el.style.cssText='color:#9b1c36;background:#fff0f3;padding:14px;border-radius:10px;white-space:pre-wrap';
  }
 }
 window.addEventListener('error',function(event){
  show(event.message||'スクリプトの読み込みに失敗しました。manabi-shared.js / manabi-config.js を確認してください');
 },true);
 window.addEventListener('unhandledrejection',function(event){
  const reason=event.reason;
  show(reason&&reason.message?reason.message:String(reason||'通信または認証処理に失敗しました'));
 });
 setTimeout(function(){show('起動処理が完了しません。ブラウザの通信制限、外部ライブラリ、Supabaseへの接続を確認してください')},12000);
})();
</script>
<script type="module">
try {
  // 構文エラーを握りつぶさず、設定ファイルの検証結果を表示する。
  const config = await import('./manabi-config.js?v=8');
  if (!/^https:\/\/[^/]+\.supabase\.co\/?$/.test(config.SUPABASE_URL || '')) {
    throw new Error('Project URLが正しくありません。末尾の /rest/v1/ は削除してください。');
  }
  if (!config.SUPABASE_PUBLISHABLE_KEY || !/^(sb_publishable_|eyJ)/.test(config.SUPABASE_PUBLISHABLE_KEY)) {
    throw new Error('Publishable keyが未入力か、形式が正しくありません。');
  }
  const {db,$,esc,time,flash,authView,login,logout,errorText} = await import('./manabi-shared.js?v=8');
const grades=['小4','小5','小6','中1','中2','中3'];let students=[],study=[],requests=[],links=[],messages=[],childRequests=[],diaryEntries=[],section='home',activeStudent=null,theme=localStorage.getItem('manabi_dark')==='yes',exitPop=localStorage.getItem('manabi_exitpop')!=='no',notify=localStorage.getItem('manabi_notify')!=='no';
document.body.classList.toggle('dark',theme);
function err(e){flash(errorText(e),'error')}
function formAuth(){ $('app').innerHTML=`<div class="auth card"><h2>先生ログイン</h2><p class="tiny">ママの管理者アカウントでログインしてください。</p><form id="auth"><label>メールアドレス</label><input type="email" name="email" autocomplete="email" required><label>パスワード</label><input type="password" name="password" autocomplete="current-password" required><p><button type="submit">ログイン</button></p></form><p class="fieldhelp">初回はSupabaseの管理画面で先生アカウントを作成し、SQLで管理者登録してください。</p></div>`;$('auth').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await login(f.get('email'),f.get('password'),true);await start()}catch(ex){err(ex)}};flash('管理者ログインが必要です')}
async function checkAdmin(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from('manabi_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error)throw error;return !!data}
async function load(){const result=await Promise.all([db.from('manabi_students').select('*').order('grade').order('name'),db.from('manabi_study').select('*').order('created_at',{ascending:false}).limit(500),db.from('manabi_requests').select('*').order('created_at',{ascending:false}),db.from('manabi_links').select('*'),db.from('manabi_messages').select('*').order('created_at',{ascending:false}).limit(500)]);for(const r of result)if(r.error)throw r.error;[students,study,requests,links,messages]=result.map(x=>x.data);const extra=await Promise.all([db.from('manabi_child_requests').select('*').order('created_at',{ascending:false}),db.from('manabi_diary').select('*').order('created_at',{ascending:false}).limit(100)]);for(const r of extra)if(r.error)throw r.error;[childRequests,diaryEntries]=extra.map(r=>r.data)}
async function start(){try{if(!await checkAdmin()){$('app').innerHTML='<div class="card"><h2>管理者の登録待ち</h2><p>このアカウントはまだ管理者として登録されていません。SupabaseのSQL設定を確認してください。</p><button id="retry">再確認</button></div>';$('retry').onclick=start;$('logout').classList.remove('hidden');$('logout').onclick=async()=>{await logout();location.reload()};flash('管理者権限がありません','error');return}await load();$('logout').classList.remove('hidden');$('logout').onclick=async()=>{try{await logout()}catch(e){err(e)}};flash('データベースに接続しました','ok');render()}catch(e){err(e)}}
function layout(inner){$('app').innerHTML=`<div class="grid"><aside class="side"><div class="menu">${[['home','ホーム'],['students','生徒管理'],['study','学習記録'],['contact','連絡管理'],['requests','保護者さん登録確認'],['childaccounts','子どもさん登録承認'],['diary','先生のひとこと日記'],['settings','設定']].map(([id,n])=>`<button data-nav="${id}" class="${section===id?'active':''}">${n}${id==='contact'&&notify&&messages.some(m=>m.sender==='保護者'&&!m.read_at)?`  ①`:''}${id==='requests'&&requests.some(r=>r.state==='申請中')?' ●':''}</button>`).join('')}</div></aside><div class="card">${inner}</div><aside class="side"><h3>今日の状況</h3><div class="stack"><div>在室中：<b>${todayVisible().filter(s=>s.status==='在室中').length}人</b></div><div>外出中：<b>${todayVisible().filter(s=>s.status==='外出中').length}人</b></div><div>未到着：<b>${todayVisible().filter(s=>s.status==='未到着').length}人</b></div><div>未確認の連絡：<b>${messages.filter(m=>m.sender==='保護者'&&!m.read_at).length}件</b></div>${todayVisible().filter(s=>s.status==='外出中'&&Date.now()-new Date(s.status_at).getTime()>=3600000).map(s=>`<div class="flash error">${esc(s.name)}：外出60分超</div>`).join('')}</div><div class="divider"></div><button id="refresh" class="secondary">最新の状態に更新</button></aside></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;activeStudent=null;render()});$('refresh').onclick=refresh}
// 今日の在室一覧は、その日に操作（追加・入室など）された生徒のみ表示する。
// 退室済み・欠席は生徒マスターからは消さず、今日の一覧からだけ除外する。
function isToday(iso){if(!iso)return false;const d=new Date(iso),n=new Date();return !Number.isNaN(d.getTime())&&d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}
// マスター登録直後の「未到着」は来塾扱いにしない。今日の在室一覧には入室・外出中の生徒だけを載せる。
function todayVisible(){return students.filter(s=>isToday(s.status_at)&&(s.status==='在室中'||s.status==='外出中'))}
// 全角カタカナをひらがなに統一し、ふりがなで50音順に並べる。
function kanaSortKey(s){return (s.kana||s.name||'').normalize('NFKC').replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s　]+/g,'')}
const manabiKanaCollator=new Intl.Collator('ja',{usage:'sort',sensitivity:'base',numeric:true});
let manabiAddBusy=false;
function openTodayAdd(){
 if(document.getElementById('manabi-add-overlay'))return;
 const overlay=document.createElement('div');overlay.id='manabi-add-overlay';overlay.className='manabi-add-backdrop';
 overlay.innerHTML='<section class="manabi-add-dialog" role="dialog" aria-modal="true" aria-labelledby="manabi-add-title"><div class="manabi-add-head"><h2 id="manabi-add-title">今日の生徒を追加</h2><button type="button" class="neutral" id="manabi-add-close" aria-label="閉じる">✕ 閉じる</button></div><div id="manabi-add-contents"></div></section>';
 document.body.appendChild(overlay);
 const previous=document.activeElement;
 function close(){overlay.remove();document.removeEventListener('keydown',keyHandler);if(previous&&previous.isConnected)previous.focus()}
 function keyHandler(e){if(e.key==='Escape')close()}
 document.addEventListener('keydown',keyHandler);
 overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
 overlay.querySelector('#manabi-add-close').onclick=close;
 const contents=overlay.querySelector('#manabi-add-contents');
 function gradeScreen(){
  contents.innerHTML='<p>学年を選んでください。</p><div class="manabi-add-grid">'+grades.map(g=>`<button type="button" class="manabi-add-grade" data-pick-grade="${g}">${g}</button>`).join('')+'</div>';
  contents.querySelectorAll('[data-pick-grade]').forEach(b=>b.onclick=()=>studentScreen(b.dataset.pickGrade));
 }
 function studentScreen(grade){
  // すでに今日の一覧にいる生徒は二重追加しない。
  const candidates=students.filter(s=>s.grade===grade&&!todayVisible().some(t=>t.id===s.id))
   .sort((a,b)=>manabiKanaCollator.compare(kanaSortKey(a),kanaSortKey(b))||manabiKanaCollator.compare(a.name,b.name));
  contents.innerHTML=`<div class="manabi-add-top"><button type="button" class="neutral" id="manabi-add-back">← 学年を選び直す</button><b>${esc(grade)}</b></div><p class="manabi-add-meta">名前を押すと、入室済みとして今日の一覧に追加されます。</p><div id="manabi-candidate-list">${candidates.map(s=>`<button type="button" class="manabi-add-person" data-add-student="${s.id}"><span>${esc(s.name)}<small>${esc(s.kana||'ふりがな未登録')}</small></span><span>追加 ＋</span></button>`).join('')||'<div class="manabi-add-empty">追加できる生徒はいません。</div>'}</div>`;
  contents.querySelector('#manabi-add-back').onclick=gradeScreen;
  contents.querySelectorAll('[data-add-student]').forEach(b=>b.onclick=async()=>{
    if(manabiAddBusy)return;manabiAddBusy=true;
    const student=students.find(s=>s.id===b.dataset.addStudent);
    b.disabled=true;b.textContent='追加中…';
    try{
      const {error}=await db.from('manabi_students').update({status:'在室中',status_at:new Date().toISOString()}).eq('id',student.id);
      if(error)throw error;
      close();await refresh();flash(`${student.name}さんを今日の在室一覧に追加しました`,'ok');
    }catch(e){err(e);b.disabled=false;b.textContent='もう一度追加する'}finally{manabiAddBusy=false}
  });
 }
 gradeScreen();overlay.querySelector('#manabi-add-close').focus();

async function loadStudentProgress(studentId){

   return `<div class="manabi-progress-item"><span class="manabi-detail-tag">${esc(subject)}</span>${row?`<p>${esc(row.details||'未入力')}</p><small class="tiny">更新：${esc(time(row.updated_at))}</small>`:'<p class="tiny">まだ入力されていません</p>'}</div>`;
  }).join('');
 }catch(ex){
  const destination=$('manabi-detail-progress');if(!destination||section!=='detail'||activeStudent!==studentId)return;

 }
}

 $('manabiPasswordForm').onsubmit=async e=>{
  e.preventDefault();
  const current=$('manabiCurrentPassword').value,newPassword=$('manabiNewPassword').value,confirmPassword=$('manabiNewConfirm').value;
  const status=$('manabiPasswordStatus'),button=$('manabiPasswordSubmit');
  if(newPassword.length<8){status.textContent='新しいパスワードは8文字以上にしてください。';return}
  if(newPassword!==confirmPassword){status.textContent='確認用パスワードが一致しません。';return}
  if(current===newPassword){status.textContent='現在とは異なるパスワードを設定してください。';return}
  button.disabled=true;status.textContent='確認・変更中…';
  try{
   const {data:{user},error:userError}=await db.auth.getUser();
   if(userError)throw userError;
   if(!user||!user.email)throw new Error('ログイン情報を確認できません。再ログインしてください。');
   const {error:signInError}=await db.auth.signInWithPassword({email:user.email,password:current});
   if(signInError)throw new Error('現在のパスワードが正しくないか、再認証に失敗しました。');
   const {error:updateError}=await db.auth.updateUser({password:newPassword});
   if(updateError)throw updateError;
   e.target.reset();status.textContent='パスワードを変更しました。次回から新しいパスワードを使ってください。';
  }catch(ex){status.textContent='変更できませんでした：'+errorText(ex)}
  finally{button.disabled=false}
 };
}
function childAccounts(){layout(`<h2>子ども用アカウントの承認</h2><p class="tiny">塾の生徒本人であることを必ず確認してから承認してください。氏名の一致だけで承認しないでください。</p>${childRequests.filter(r=>r.state==='申請中').map(r=>`<div class="entry"><b>${esc(r.child_name)}（${esc(r.grade)}）</b><div class="inline"><select data-child-pick="${r.id}"><option value="">紐づける生徒を選択</option>${students.map(s=>`<option value="${s.id}">${esc(s.grade)} ${esc(s.name)}</option>`).join('')}</select><button data-child-approve="${r.id}">承認</button><button class="neutral" data-child-reject="${r.id}">却下</button></div></div>`).join('')||'<p>承認待ちの申請はありません。</p>'}`);document.querySelectorAll('[data-child-approve]').forEach(b=>b.onclick=async()=>{const r=childRequests.find(x=>x.id===b.dataset.childApprove),sid=document.querySelector(`[data-child-pick="${r.id}"]`).value;if(!sid){alert('生徒を選んでください');return}if(!confirm('本人確認は済んでいますか？ この生徒の在室・学習情報を子ども用アカウントに公開します。'))return;try{let result=await db.from('manabi_child_links').insert({child_user_id:r.child_user_id,student_id:sid});if(result.error)throw result.error;result=await db.from('manabi_child_requests').update({state:'承認',decided_at:new Date().toISOString()}).eq('id',r.id);if(result.error)throw result.error;await refresh()}catch(e){err(e)}});document.querySelectorAll('[data-child-reject]').forEach(b=>b.onclick=async()=>{if(!confirm('申請を却下しますか？'))return;const {error}=await db.from('manabi_child_requests').update({state:'却下',decided_at:new Date().toISOString()}).eq('id',b.dataset.childReject);if(error)err(error);else refresh()})}
function diaryPage(){layout(`<h2>先生のひとこと日記</h2><p>子ども用アプリに表示する、先生からのひとことです。</p><form id="diaryForm"><label>今日のひとこと（500文字以内）</label><textarea name="body" maxlength="500" required placeholder="今日の塾で感じたことや、みんなへのひとこと"></textarea><p><button type="submit">日記を投稿</button></p></form><h3>過去の投稿</h3>${diaryEntries.map(d=>`<div class="entry"><small>${time(d.created_at)}</small><p style="white-space:pre-wrap">${esc(d.body)}</p><button class="neutral" data-diary-delete="${d.id}">削除</button></div>`).join('')||'<p>まだ投稿はありません。</p>'}`);$('diaryForm').onsubmit=async e=>{e.preventDefault();const body=e.target.elements.namedItem('body').value.trim();if(!body)return;try{const {error}=await db.from('manabi_diary').insert({body});if(error)throw error;await refresh();flash('日記を投稿しました','ok')}catch(e){err(e)}};document.querySelectorAll('[data-diary-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('この日記を削除しますか？'))return;const {error}=await db.from('manabi_diary').delete().eq('id',b.dataset.diaryDelete);if(error)err(error);else refresh()})}
function render(){({home,students:manage,detail:studentDetail,study:studyPage,contact,requests:approve,childaccounts:childAccounts,diary:diaryPage,settings:settingsPage}[section]||home)()}
async function refresh(){try{await load();render();flash('最新の情報に更新しました','ok')}catch(e){err(e)}}
authView(start).then(u=>{if(!u&&db)formAuth()}).catch(e=>{err(e);$('app').innerHTML='<div class="card"><h2>ログイン画面の読み込みに失敗しました</h2><p>上のエラーメッセージを確認してください。</p><button onclick="location.reload()">再読み込み</button></div>'});setInterval(()=>{if(!document.hidden&&$('logout')&&!$('logout').classList.contains('hidden'))refresh()},60000);
} catch (e) {
  const el = document.getElementById('message');
  const detail = e instanceof SyntaxError
    ? `接続用JavaScriptに構文エラーがあります。特に manabi-config.js の引用符（'）の閉じ忘れを確認してください。`
    : (e && e.message) || String(e);
  el.textContent = '起動に失敗しました：' + detail;
  el.style.cssText = 'color:#9b1c36;background:#fff0f3;padding:14px;border-radius:10px;white-space:pre-wrap';
  document.getElementById('app').innerHTML = '<section class="card"><h2>起動できませんでした</h2><p>GitHubの <code>manabi-config.js</code> を確認してください。</p><p>URLは <code>https://xxxx.supabase.co</code> の形式にします。Publishable keyの前後には半角のシングルクォーテーションが必要です。</p></section>';
}

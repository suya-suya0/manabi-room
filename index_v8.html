<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まなび管理室｜管理者</title><link rel="stylesheet" href="./manabi-style.css"></head><body><div class="wrap"><header class="top"><div><div class="brand">✿ まなび管理室</div><div class="sub">先生用・管理画面</div></div><button id="logout" class="neutral hidden">ログアウト</button></header><div id="message" class="flash" role="status">接続準備中…</div><main id="app"></main></div><script>
// 初期化の失敗を「接続準備中…」のままにしないための診断表示
(function(){
 function show(message){
  const el=document.getElementById('message');
  if(!el)return;
  if(el.textContent.includes('接続準備中')){
   el.textContent='起動エラー：'+message+'（ページを再読み込みしても続く場合、この表示を教えてください）';
   el.style.cssText='color:#9b1c36;background:#fff0f3;padding:14px;border-radius:10px;white-space:pre-wrap';
  }
 }
 window.addEventListener('error',function(event){
  show(event.message||'スクリプトの読み込みに失敗しました。manabi-shared.js / manabi-config.js を確認してください');
 },true);
 window.addEventListener('unhandledrejection',function(event){
  const reason=event.reason;
  show(reason&&reason.message?reason.message:String(reason||'通信または認証処理に失敗しました'));
 });
 setTimeout(function(){show('起動処理が完了しません。ブラウザの通信制限、外部ライブラリ、Supabaseへの接続を確認してください')},12000);
})();
</script>
<script type="module">
try {
  // 構文エラーを握りつぶさず、設定ファイルの検証結果を表示する。
  const config = await import('./manabi-config.js?v=8');
  if (!/^https:\/\/[^/]+\.supabase\.co\/?$/.test(config.SUPABASE_URL || '')) {
    throw new Error('Project URLが正しくありません。末尾の /rest/v1/ は削除してください。');
  }
  if (!config.SUPABASE_PUBLISHABLE_KEY || !/^(sb_publishable_|eyJ)/.test(config.SUPABASE_PUBLISHABLE_KEY)) {
    throw new Error('Publishable keyが未入力か、形式が正しくありません。');
  }
  const {db,$,esc,time,flash,authView,login,logout,errorText} = await import('./manabi-shared.js?v=8');
const grades=['小4','小5','小6','中1','中2','中3'];let students=[],study=[],requests=[],links=[],messages=[],section='home',activeStudent=null,theme=localStorage.getItem('manabi_dark')==='yes',exitPop=localStorage.getItem('manabi_exitpop')!=='no',notify=localStorage.getItem('manabi_notify')!=='no';
document.body.classList.toggle('dark',theme);
function err(e){flash(errorText(e),'error')}
function formAuth(){ $('app').innerHTML=`<div class="auth card"><h2>先生ログイン</h2><p class="tiny">ママの管理者アカウントでログインしてください。</p><form id="auth"><label>メールアドレス</label><input type="email" name="email" autocomplete="email" required><label>パスワード</label><input type="password" name="password" autocomplete="current-password" required><p><button type="submit">ログイン</button></p></form><p class="fieldhelp">初回はSupabaseの管理画面で先生アカウントを作成し、SQLで管理者登録してください。</p></div>`;$('auth').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await login(f.get('email'),f.get('password'),true);await start()}catch(ex){err(ex)}};flash('管理者ログインが必要です')}
async function checkAdmin(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from('manabi_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error)throw error;return !!data}
async function load(){const result=await Promise.all([db.from('manabi_students').select('*').order('grade').order('name'),db.from('manabi_study').select('*').order('created_at',{ascending:false}).limit(500),db.from('manabi_requests').select('*').order('created_at',{ascending:false}),db.from('manabi_links').select('*'),db.from('manabi_messages').select('*').order('created_at',{ascending:false}).limit(500)]);for(const r of result)if(r.error)throw r.error;[students,study,requests,links,messages]=result.map(x=>x.data)}
async function start(){try{if(!await checkAdmin()){$('app').innerHTML='<div class="card"><h2>管理者の登録待ち</h2><p>このアカウントはまだ管理者として登録されていません。SupabaseのSQL設定を確認してください。</p><button id="retry">再確認</button></div>';$('retry').onclick=start;flash('管理者権限がありません','error');return}await load();$('logout').classList.remove('hidden');$('logout').onclick=async()=>{try{await logout()}catch(e){err(e)}};flash('データベースに接続しました','ok');render()}catch(e){err(e)}}
function layout(inner){$('app').innerHTML=`<div class="grid"><aside class="side"><div class="menu">${[['home','ホーム'],['students','生徒管理'],['study','学習記録'],['contact','連絡管理'],['requests','登録承認'],['settings','設定']].map(([id,n])=>`<button data-nav="${id}" class="${section===id?'active':''}">${n}${id==='contact'&&notify&&messages.some(m=>m.sender==='保護者'&&!m.read_at)?`  ①`:''}${id==='requests'&&requests.some(r=>r.state==='申請中')?' ●':''}</button>`).join('')}</div></aside><div class="card">${inner}</div><aside class="side"><h3>今日の状況</h3><div class="stack"><div>在室中：<b>${students.filter(s=>s.status==='在室中').length}人</b></div><div>外出中：<b>${students.filter(s=>s.status==='外出中').length}人</b></div><div>未到着：<b>${students.filter(s=>s.status==='未到着').length}人</b></div><div>未確認の連絡：<b>${messages.filter(m=>m.sender==='保護者'&&!m.read_at).length}件</b></div>${students.filter(s=>s.status==='外出中'&&Date.now()-new Date(s.status_at).getTime()>=3600000).map(s=>`<div class="flash error">${esc(s.name)}：外出60分超</div>`).join('')}</div><div class="divider"></div><button id="refresh" class="secondary">最新の状態に更新</button></aside></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;activeStudent=null;render()});$('refresh').onclick=refresh}
function gradeSelect(value='中1'){return grades.map(g=>`<option ${g===value?'selected':''}>${g}</option>`).join('')}
function studentRows(){return [...students].sort((a,b)=>grades.indexOf(a.grade)-grades.indexOf(b.grade)||a.name.localeCompare(b.name,'ja')).map(s=>`<div class="entry row"><div><button class="secondary" data-study="${s.id}">${esc(s.grade)} ${esc(s.name)}</button><div class="tiny">${esc(s.kana||'')}　${time(s.status_at)}</div></div><span class="chip ${s.status}">${s.status}</span><div class="inline">${s.status==='在室中'?`<button data-state="${s.id}|外出中">外出</button>`:s.status==='外出中'?`<button data-state="${s.id}|在室中">再入室</button>`:`<button data-state="${s.id}|在室中">入室</button>`}<button class="neutral" data-state="${s.id}|退室済み">退室</button></div></div>`).join('')||'<p>生徒はまだ登録されていません。</p>'}
function home(){layout(`<h2>在室一覧</h2><div class="cards">${['在室中','外出中','未到着'].map(t=>`<div class="stat">${t}<strong>${students.filter(s=>s.status===t).length}</strong></div>`).join('')}</div><div style="margin-top:12px">${studentRows()}</div>`);bindStatus()}
function bindStatus(){document.querySelectorAll('[data-state]').forEach(b=>b.onclick=async()=>{const [id,status]=b.dataset.state.split('|');if(status==='退室済み'&&exitPop&&!confirm('この生徒を退室済みにしますか？'))return;try{const {error}=await db.from('manabi_students').update({status,status_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await refresh()}catch(e){err(e)}});document.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>{activeStudent=b.dataset.study;section='study';render()})}
function manage(){layout(`<h2>生徒管理</h2><form id="addStudent" class="stack"><div class="row"><div style="flex:2"><label>氏名（姓・名）</label><input name="name" required maxlength="100" placeholder="例：田中 花子"></div><div style="flex:2"><label>ふりがな</label><input name="kana" maxlength="100"></div><div><label>学年</label><select name="grade">${gradeSelect()}</select></div></div><button type="submit">生徒を追加</button></form><div class="divider"></div>${students.map(s=>`<div class="entry row"><b>${esc(s.grade)}　${esc(s.name)}</b><button class="secondary" data-edit="${s.id}">編集</button><button class="danger" data-del="${s.id}">削除</button></div>`).join('')}`);$('addStudent').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const {error}=await db.from('manabi_students').insert({name:f.get('name').trim(),kana:f.get('kana').trim(),grade:f.get('grade')});if(error)throw error;await refresh()}catch(e){err(e)}};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const s=students.find(x=>x.id===b.dataset.edit);const name=prompt('生徒氏名',s.name);if(name===null||!name.trim())return;const grade=prompt('学年（小4〜中3）',s.grade);if(!grades.includes(grade)){alert('学年は小4〜中3から選んでください');return}try{const {error}=await db.from('manabi_students').update({name:name.trim(),grade}).eq('id',s.id);if(error)throw error;await refresh()}catch(e){err(e)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('この生徒と学習記録・承認済みの紐づけを削除しますか？'))return;try{const {error}=await db.from('manabi_students').delete().eq('id',b.dataset.del);if(error)throw error;await refresh()}catch(e){err(e)}})}
function studyPage(){const s=students.find(x=>x.id===activeStudent);layout(`<h2>学習記録</h2>${s?`<div class="card"><h3>${esc(s.grade)} ${esc(s.name)}</h3><form id="studyForm"><label>科目</label><div class="tabbar">${['国','数','理','社','英','その他'].map(t=>`<button type="button" data-subject="${t}" class="${t==='国'?'active':''}">${t}</button>`).join('')}</div><input id="otherSubject" placeholder="その他の内容" class="hidden" maxlength="50"><label>取り組んだページ数：<b id="pageno">10</b>ページ</label><input id="pages" type="range" min="0" max="100" value="10"><div class="row"><button type="submit">決定して記録</button><button type="button" class="secondary" id="back">一覧に戻る</button></div></form></div><h3 style="margin-top:18px">記録履歴</h3>${study.filter(r=>r.student_id===s.id).map(r=>`<div class="entry">${esc(r.subject)}　${r.pages}ページ　<span class="tiny">${time(r.created_at)}</span></div>`).join('')||'<p>記録はありません。</p>'}`:students.map(s=>`<div class="entry row"><b>${esc(s.grade)}　${esc(s.name)}</b><button data-study="${s.id}">学習記録</button></div>`).join('')}`);if(!s){document.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>{activeStudent=b.dataset.study;render()});return}let subject='国';document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{subject=b.dataset.subject;document.querySelectorAll('[data-subject]').forEach(x=>x.classList.toggle('active',x===b));$('otherSubject').classList.toggle('hidden',subject!=='その他')});$('pages').oninput=e=>$('pageno').textContent=e.target.value;$('back').onclick=()=>{activeStudent=null;render()};$('studyForm').onsubmit=async e=>{e.preventDefault();const subj=subject==='その他'?$('otherSubject').value.trim():subject;if(!subj){alert('その他の内容を入力してください');return}try{const {error}=await db.from('manabi_study').insert({student_id:s.id,subject:subj,pages:Number($('pages').value)});if(error)throw error;await refresh()}catch(e){err(e)}}}
let chatId=null;function contact(){const m=messages.find(x=>x.id===chatId);layout(`<h2>連絡管理</h2><p class="tiny">保護者からの連絡を確認し、同じ画面で返信できます。</p>${m?`<button id="closeChat" class="secondary">一覧に戻る</button><h3 style="margin-top:18px">${esc(students.find(s=>s.id===m.student_id)?.name||'生徒')} のトーク</h3><div class="chat" id="chat">${messages.filter(x=>x.student_id===m.student_id&&x.guardian_id===m.guardian_id).slice().reverse().map(x=>`<div class="bubble ${x.sender==='先生'?'mine':''}">${esc(x.body)}<small>${esc(x.sender)} · ${esc(x.kind)} · ${time(x.created_at)}</small></div>`).join('')}</div><form id="reply"><label>返信内容（400文字以内）</label><textarea maxlength="400" id="replyText" required></textarea><button>返信する</button></form>`:messages.filter(x=>x.sender==='保護者').map(x=>`<div class="entry"><div class="row"><b>${esc(students.find(s=>s.id===x.student_id)?.name||'生徒')} ／ ${esc(x.kind)}</b><small>${time(x.created_at)}</small></div><div class="message-body">${esc(x.body)}</div><div class="row"><span class="tiny">${x.read_at?'確認済み':'未確認'}</span><button data-chat="${x.id}">会話・返信</button></div></div>`).join('')||'<p>まだ連絡はありません。</p>'}`);if(m){$('closeChat').onclick=()=>{chatId=null;render()};$('reply').onsubmit=async e=>{e.preventDefault();try{const {error}=await db.from('manabi_messages').insert({student_id:m.student_id,guardian_id:m.guardian_id,sender:'先生',kind:'相談',body:$('replyText').value.trim()});if(error)throw error;await refresh()}catch(e){err(e)}}}else document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=async()=>{chatId=b.dataset.chat;const x=messages.find(x=>x.id===chatId);if(!x.read_at){const {error}=await db.from('manabi_messages').update({read_at:new Date().toISOString()}).eq('id',x.id);if(error)err(error)}await refresh()})}
function approve(){layout(`<h2>保護者の登録申請</h2><p class="tiny">保護者本人かを塾で確認したうえで承認してください。名前の一致だけでは承認しないでね。</p>${requests.filter(r=>r.state==='申請中').map(r=>`<div class="entry"><b>保護者：${esc(r.guardian_name)}</b><p>申請したお子さま：${esc(r.child_name)}　${esc(r.grade)}</p><div class="inline"><select data-sel="${r.id}" class="w200"><option value="">生徒を選ぶ</option>${students.map(s=>`<option value="${s.id}">${esc(s.grade)} ${esc(s.name)}</option>`).join('')}</select><button data-approve="${r.id}">承認する</button><button class="neutral" data-reject="${r.id}">却下</button></div></div>`).join('')||'<p>承認待ちの申請はありません。</p>'}<h3 style="margin-top:24px">承認済み</h3>${links.map(l=>`<div class="entry row"><span>${esc(students.find(s=>s.id===l.student_id)?.name||'削除済み')}（保護者ID末尾：${esc(l.guardian_id.slice(-6))}）</span><button class="danger" data-unlink="${l.student_id}|${l.guardian_id}">紐づけ解除</button></div>`).join('')||'<p class="tiny">まだありません</p>'}`);document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{const req=requests.find(r=>r.id===b.dataset.approve),sid=document.querySelector(`[data-sel="${req.id}"]`).value,s=students.find(s=>s.id===sid);if(!s){alert('紐づける生徒を選んでください');return}if(!confirm(`保護者「${req.guardian_name}」が「${s.name}」の情報を見ることを許可しますか？ 本人確認済みの場合のみ続けてください。`))return;try{const {error}=await db.from('manabi_links').upsert({guardian_id:req.guardian_id,student_id:s.id});if(error)throw error;const r=await db.from('manabi_requests').update({state:'承認',decided_at:new Date().toISOString()}).eq('id',req.id);if(r.error)throw r.error;await refresh()}catch(e){err(e)}});document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{if(!confirm('申請を却下しますか？'))return;try{const {error}=await db.from('manabi_requests').update({state:'却下',decided_at:new Date().toISOString()}).eq('id',b.dataset.reject);if(error)throw error;await refresh()}catch(e){err(e)}});document.querySelectorAll('[data-unlink]').forEach(b=>b.onclick=async()=>{if(!confirm('保護者の閲覧権限を解除しますか？'))return;const [sid,gid]=b.dataset.unlink.split('|');try{const {error}=await db.from('manabi_links').delete().eq('student_id',sid).eq('guardian_id',gid);if(error)throw error;await refresh()}catch(e){err(e)}})}
function settingsPage(){layout(`<h2>設定</h2>${[['dark','シンプルダークモード',theme],['exit','退室時に確認POPを表示',exitPop],['notify','未確認の連絡をメニューに表示',notify]].map(([id,t,v])=>`<div class="entry row"><b>${t}</b><label class="check"><input type="checkbox" id="${id}" ${v?'checked':''}> ON</label></div>`).join('')}<p class="tiny">この3つはこのブラウザに保存されます。</p>`);$('dark').onchange=e=>{theme=e.target.checked;localStorage.setItem('manabi_dark',theme?'yes':'no');document.body.classList.toggle('dark',theme)};$('exit').onchange=e=>{exitPop=e.target.checked;localStorage.setItem('manabi_exitpop',exitPop?'yes':'no')};$('notify').onchange=e=>{notify=e.target.checked;localStorage.setItem('manabi_notify',notify?'yes':'no');render()}}
function render(){({home,students:manage,study:studyPage,contact,requests:approve,settings:settingsPage}[section]||home)()}
async function refresh(){try{await load();render();flash('最新の情報に更新しました','ok')}catch(e){err(e)}}
authView(start).then(u=>{if(!u&&db)formAuth()}).catch(e=>{err(e);$('app').innerHTML='<div class="card"><h2>ログイン画面の読み込みに失敗しました</h2><p>上のエラーメッセージを確認してください。</p><button onclick="location.reload()">再読み込み</button></div>'});setInterval(()=>{if(!document.hidden&&$('logout')&&!$('logout').classList.contains('hidden'))refresh()},60000);
} catch (e) {
  const el = document.getElementById('message');
  const detail = e instanceof SyntaxError
    ? `接続用JavaScriptに構文エラーがあります。特に manabi-config.js の引用符（'）の閉じ忘れを確認してください。`
    : (e && e.message) || String(e);
  el.textContent = '起動に失敗しました：' + detail;
  el.style.cssText = 'color:#9b1c36;background:#fff0f3;padding:14px;border-radius:10px;white-space:pre-wrap';
  document.getElementById('app').innerHTML = '<section class="card"><h2>起動できませんでした</h2><p>GitHubの <code>manabi-config.js</code> を確認してください。</p><p>URLは <code>https://xxxx.supabase.co</code> の形式にします。Publishable keyの前後には半角のシングルクォーテーションが必要です。</p></section>';
}
</script></body></html>

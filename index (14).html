<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まなび管理室｜先生用</title><style>
:root{font-family:'Segoe UI','Yu Gothic',Meiryo,sans-serif;color:#403440;background:#fff9fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:9px 15px}header{background:#fff0f5;border-bottom:1px solid #f1dbe4;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:25px;color:#934e6c}header small{color:#967d89}.shell{display:grid;grid-template-columns:190px minmax(0,1fr) 280px;gap:20px;max-width:1600px;margin:auto;padding:22px}.nav{background:#fff1f5;border-radius:16px;padding:12px;align-self:start}.nav div{padding:13px;border-radius:10px;color:#765a6b}.nav .active{background:#e9b4c7;color:#6c2e4c;font-weight:700}.main,.side{min-width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid #f2e2e8;border-radius:16px;padding:17px}.stat strong{display:block;font-size:29px;margin-top:6px}.stat.green{background:#eff9f3}.stat.orange{background:#fff4e9}.stat.red{background:#fff0f2}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{background:#fff;border:1px solid #ead8df;color:#785c6c}.toolbar button.active{background:#c76f91;color:white}.toolbar input{margin-left:auto;border:1px solid #ead8df;border-radius:10px;padding:9px;min-width:160px}.panel{background:white;border:1px solid #f0e1e7;border-radius:16px;padding:16px;margin-bottom:15px;box-shadow:0 4px 18px #a9607c0b}.panel h2{font-size:17px;margin:0 0 13px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;background:#fbf4f7;font-size:13px;color:#806f78}td,th{padding:11px 8px;border-bottom:1px solid #f3e9ed}td{font-size:14px}.status{border-radius:30px;padding:5px 9px;font-weight:700;font-size:12px}.在室中{background:#e2f5e9;color:#168451}.外出中{background:#fff0da;color:#b86c00}.未到着{background:#ffe5e8;color:#c43951}.退室済み{background:#f1eff2;color:#756c75}.欠席{background:#f1eff2;color:#756c75}.primary{background:#d8759b;color:#fff;min-width:86px}.secondary{background:#f8edf2;color:#915a70}.danger{color:#d53f56;font-weight:700}.muted{color:#978692;font-size:12px}.side p{margin:8px 0;font-size:14px}.notice{padding:11px;border-radius:10px;background:#fff4f6;margin:8px 0;font-size:13px}.empty{color:#8d8187}footer{padding:15px 22px;color:#8e7c86;font-size:12px;text-align:center}@media(max-width:1100px){.shell{grid-template-columns:160px 1fr}.side{grid-column:2}}@media(max-width:700px){.shell{display:block;padding:12px}.nav{display:none}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:23px}.toolbar input{margin-left:0;width:100%}header{padding:14px}header h1{font-size:20px}}
</style></head><body><header><div><h1>✿ まなび管理室</h1><small>個別指導塾・生徒管理システム（試作版）</small></div><div id="clock"></div></header><div class="shell"><nav class="nav"><div class="active">⌂ ホーム</div><div>♙ 生徒管理（準備中）</div><div>▤ 学習記録（準備中）</div><div>☏ 連絡管理（準備中）</div><div>▦ カレンダー（準備中）</div><div>⚙ 設定（準備中）</div></nav><main class="main"><div class="stats"><div class="stat green">在室中<strong id="inCount">0人</strong></div><div class="stat orange">外出中<strong id="outCount">0人</strong></div><div class="stat red">未到着<strong id="lateCount">0人</strong></div></div><div class="toolbar" id="filters"></div><section class="panel"><h2>生徒一覧</h2><div class="tablewrap"><table><thead><tr><th>生徒名</th><th>学年</th><th>状態</th><th>時刻・備考</th><th>操作</th><th>退室</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel"><h2>操作履歴（この画面内のみ）</h2><div id="history" class="muted">まだ操作はありません。</div></section></main><aside class="side"><section class="panel"><h2>お知らせ</h2><p class="empty">保護者との連絡機能は今後追加します。</p></section><section class="panel"><h2>警告</h2><div id="alerts" class="muted">警告はありません。</div></section><section class="panel"><h2>本日の予定</h2><p class="empty">来塾予定の登録機能は今後追加します。</p></section><section class="panel"><h2>今日のメモ</h2><textarea style="width:100%;min-height:95px;border:1px solid #ead8df;border-radius:10px;padding:10px" placeholder="このメモは保存されません"></textarea></section></aside></div><footer>試作版：架空の生徒データです。ページ更新で操作結果はリセットされます。実際の個人情報は入力しないでください。</footer><script>
const sample=[['田中 花子','中1','在室中',null],['佐藤 太郎','中1','外出中',Date.now()-25*60000],['鈴木 美咲','中2','未到着',null],['山本 翔','中3','在室中',null],['高橋 優','中3','在室中',null],['伊藤 莉子','中2','外出中',Date.now()-65*60000],['渡辺 結衣','中1','在室中',null],['中村 大輝','中2','在室中',null]].map((a,i)=>({id:i,name:a[0],grade:a[1],status:a[2],at:a[3]}));let students=sample,filter='全員',search='',history=[];const fmt=t=>new Date(t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function change(id,action){const s=students.find(x=>x.id===id);if(!s)return;const old=s.status;if(action==='退室済み'&&!confirm(s.name+'さんを退室済みにしますか？'))return;s.status=action;s.at=Date.now();history.unshift(fmt(s.at)+'　'+s.name+'：'+old+' → '+action);render()}function render(){document.getElementById('clock').textContent=new Date().toLocaleString('ja-JP',{dateStyle:'medium',timeStyle:'short'});for(const [id,status] of [['inCount','在室中'],['outCount','外出中'],['lateCount','未到着']])document.getElementById(id).textContent=students.filter(s=>s.status===status).length+'人';document.getElementById('filters').innerHTML=['全員','中1','中2','中3','在室中','外出中','未到着'].map(f=>`<button class="${filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')+'<input id="search" placeholder="生徒名で検索" value="'+escapeHtml(search)+'">';document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.getElementById('search').oninput=e=>{search=e.target.value;drawRows()};drawRows();const alerts=students.filter(s=>s.status==='外出中'&&s.at&&Date.now()-s.at>=60*60000);document.getElementById('alerts').innerHTML=alerts.length?alerts.map(s=>`<div class="notice danger">${escapeHtml(s.name)}：外出60分超</div>`).join(''):'警告はありません。';document.getElementById('history').innerHTML=history.length?history.slice(0,8).map(x=>'<p>'+escapeHtml(x)+'</p>').join(''):'まだ操作はありません。'}function drawRows(){const arr=students.filter(s=>(filter==='全員'||s.grade===filter||s.status===filter)&&s.name.includes(search));document.getElementById('rows').innerHTML=arr.map(s=>{const action=s.status==='在室中'?'外出中':s.status==='外出中'?'在室中':s.status==='未到着'?'在室中':null;const label=s.status==='在室中'?'外出':s.status==='外出中'?'再入室':'入室';const elapsed=s.status==='外出中'&&s.at?`（${Math.floor((Date.now()-s.at)/60000)}分経過）`:'';return `<tr><td><b>${escapeHtml(s.name)}</b></td><td>${s.grade}</td><td><span class="status ${s.status}">${s.status}</span></td><td class="muted">${s.at?fmt(s.at)+elapsed:'—'}</td><td>${action?`<button class="primary" data-id="${s.id}" data-action="${action}">${label}</button>`:'—'}</td><td>${s.status==='在室中'||s.status==='外出中'?`<button class="secondary" data-id="${s.id}" data-action="退室済み">退室</button>`:'—'}</td></tr>`}).join('')||'<tr><td colspan="6">該当する生徒はいません</td></tr>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>change(Number(b.dataset.id),b.dataset.action))}render();setInterval(()=>{const active=document.activeElement;if(active?.id==='search'){const v=active.value;render();document.getElementById('search').value=v;document.getElementById('search').focus()}else render()},60000);
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff7fa"><title>まなび管理室｜保護者ページ v0.2（試作版）</title>
<style>
:root{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,system-ui,sans-serif;color:#403844;background:#fff9fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#fff7fa,#fffdfc 56%,#fff5f7)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b54e78;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.45}.shell{max-width:540px;margin:auto;min-height:100dvh;background:#fffafc;box-shadow:0 0 55px #8c557014;position:relative;padding-bottom:100px}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;background:#fffafcee;backdrop-filter:blur(12px);border-bottom:1px solid #f5e5eb;padding:18px 20px}.brand{display:flex;gap:9px;align-items:center;font-size:19px;font-weight:800;letter-spacing:.02em;color:#633a4f}.flower{width:33px;height:33px;border-radius:11px;background:#f5dbe5;color:#b85b83;display:grid;place-items:center;font-size:23px}.iconbtn{display:grid;place-items:center;width:40px;height:40px;border:1px solid #efdde5;border-radius:13px;background:white;color:#975975;font-size:18px}.page{padding:24px 20px 18px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#a37387;font-weight:700}.title{font-size:25px;line-height:1.4;margin:7px 0 8px;letter-spacing:-.03em}.lead{margin:0 0 25px;font-size:14px;line-height:1.85;color:#82737d}.label{display:block;font-size:14px;font-weight:700;margin:0 0 7px;color:#55424d}.field{width:100%;border:1px solid #e9dce2;background:#fff;border-radius:14px;padding:14px;min-height:50px;color:#443742;outline:none}.field:focus{border-color:#bd7896}.stack{display:grid;gap:15px}.card{background:white;border:1px solid #f1e4e9;border-radius:20px;padding:19px;box-shadow:0 4px 16px #9d66810b}.intro{background:linear-gradient(120deg,#fbe8ef,#fff8fa);border:1px solid #f5d6e2;border-radius:22px;padding:20px;margin-bottom:20px;position:relative;overflow:hidden}.intro::after{content:'✿';position:absolute;right:-8px;top:-25px;color:#efc3d2;font-size:100px;opacity:.5}.intro>*{position:relative;z-index:1}.intro h2{font-size:21px;margin:5px 0 7px}.intro p{font-size:13px;color:#866979;margin:0;line-height:1.7}.section-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.section-head h3{margin:0;font-size:17px}.section-head small{color:#a17f90;font-size:12px}.student{display:grid;gap:14px;margin-bottom:13px}.student-head{display:flex;align-items:center;gap:13px}.avatar{width:47px;height:47px;flex:0 0 47px;border-radius:16px;background:#fae7ed;display:grid;place-items:center;color:#af5e7e;font-size:22px}.name{font-weight:800;font-size:17px}.grade{font-size:12px;color:#907e87;margin-top:4px}.status{margin-left:auto;white-space:nowrap;border-radius:99px;padding:8px 11px;font-size:13px;font-weight:800}.present{color:#21835a;background:#e6f6ec}.away{color:#b46e18;background:#fff1df}.late{color:#c4435b;background:#ffecf0}.gone{color:#6f6875;background:#f1eff2}.unknown{color:#706671;background:#f1eff2}.student-foot{border-top:1px solid #f4edf0;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#7e707b;font-size:12px}.muted{color:#90808a;font-size:13px;line-height:1.7}.primary{border:0;background:#cb7395;color:white;border-radius:15px;min-height:52px;padding:12px 18px;font-weight:800;box-shadow:0 5px 13px #cd8fa637}.primary:hover{background:#b95e83}.secondary{border:1px solid #eed0dd;background:#fff4f8;color:#a65378;border-radius:15px;min-height:49px;padding:11px 17px;font-weight:800}.plain{border:1px solid #eddde5;background:white;color:#6f5866;border-radius:14px;min-height:45px;padding:10px 14px}.wide{width:100%}.tiny{font-size:12px}.button-row{display:flex;gap:9px;flex-wrap:wrap}.notice{display:flex;gap:12px;align-items:center;padding:16px;border:1px solid #f2e2e8;border-radius:17px;background:#fff}.noticeIcon{font-size:21px;color:#c76d91}.notice b{display:block;font-size:14px}.notice p{margin:5px 0 0;font-size:12px;color:#95838d}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);max-width:540px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);background:#fffefef7;backdrop-filter:blur(12px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #f0dfe7;box-shadow:0 -4px 18px #8c557012}.nav button{border:0;background:transparent;color:#9a8590;display:grid;justify-items:center;gap:4px;padding:8px;font-size:12px;border-radius:12px;font-weight:700}.nav button span{font-size:22px}.nav button.active{background:#fbeaf1;color:#b4537b}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #e8dbe1;border-radius:12px;background:#fff;color:#745b68;padding:11px 15px;font-size:14px;font-weight:700}.pill.active{background:#bf6b8d;color:#fff;border-color:#bf6b8d}.counter{font-size:12px;color:#9e7f90;text-align:right;margin-top:5px}.message{max-width:86%;border-radius:16px;padding:12px 14px;margin:12px 0;line-height:1.65;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}.mine{margin-left:auto;background:#f6dce7;color:#5c3a4a;border-bottom-right-radius:4px}.theirs{background:#f3f1f3;border-bottom-left-radius:4px}.message time{display:block;margin-top:4px;font-size:10px;opacity:.6}.chip{display:inline-flex;border-radius:99px;background:#f7ebef;color:#a66282;padding:5px 10px;font-size:11px;font-weight:700}.empty{text-align:center;padding:35px 15px;color:#96818c;font-size:14px;line-height:1.8}.info{padding:13px 15px;border-radius:14px;background:#fff1f5;color:#85576e;font-size:13px;line-height:1.7;margin-bottom:16px}.divider{border:0;border-top:1px solid #f0e6ea;margin:18px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.demo{position:fixed;top:76px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 20px));z-index:11;pointer-events:none;text-align:center}.demo span{display:inline-block;background:#514751ed;color:white;padding:7px 12px;border-radius:99px;font-size:11px;box-shadow:0 4px 12px #0002}.toast{position:fixed;z-index:50;bottom:100px;left:50%;transform:translateX(-50%);background:#463a45;color:white;border-radius:14px;padding:12px 20px;max-width:90%;box-shadow:0 5px 26px #0002;font-size:13px}.toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #f1e6eb}.switch{border-radius:99px;min-width:51px;height:30px;background:#c6bdc2;border:0;padding:3px;text-align:left}.switch.on{background:#c37395}.switch i{display:block;width:24px;height:24px;border-radius:50%;background:white;transition:transform .15s}.switch.on i{transform:translateX(21px)}.hidden{display:none!important}@media(max-width:380px){.page{padding:18px 14px}.top{padding:14px}.status{font-size:11px}.student-head{gap:9px}.name{font-size:15px}}@media(min-width:800px){body{padding:35px 0}.shell{border-radius:26px;overflow:hidden;min-height:850px;border:1px solid #efdce4}.nav{bottom:0}}

/* v0.2 consultation chat */
.chat-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;background:#fff;border:1px solid #f1dfe7;border-radius:17px 17px 0 0}
.chat-header b{font-size:16px}.chat-stream{background:#fdf5f8;min-height:290px;max-height:51dvh;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:13px;border:1px solid #f1dfe7;border-top:0;scroll-behavior:smooth}
.chat-line{display:flex;flex-direction:column;max-width:87%;gap:3px}.chat-line.mine-line{align-self:flex-end;align-items:flex-end}.chat-line.their-line{align-self:flex-start;align-items:flex-start}.chat-who{font-size:11px;color:#8f7c88;margin:0 5px}.chat-bubble{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #f0e4e8;border-radius:16px 16px 16px 4px;padding:11px 14px;font-size:15px;line-height:1.65;color:#513f49}.mine-line .chat-bubble{background:#efd0dd;border-color:#efd0dd;border-radius:16px 16px 4px 16px}.chat-meta{font-size:10px;color:#94818c;margin:0 5px}.chat-compose{position:relative;background:white;padding:12px;border:1px solid #f1dfe7;border-top:0;border-radius:0 0 17px 17px}.chat-compose textarea{width:100%;resize:vertical;min-height:78px;max-height:180px;border:1px solid #e9dce2;border-radius:13px;padding:12px;background:#fff;font-size:15px;line-height:1.6}.chat-compose-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}.chat-compose-footer button{min-height:42px;padding:8px 24px}.chat-note{font-size:12px;line-height:1.6;color:#8f6f80;margin:10px 2px}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span class="flower">✿</span><span>まなび管理室</span></div><button class="iconbtn" onclick="navigate('settings')" aria-label="設定">⚙</button></header>
<div class="demo"><span>デモ版｜架空の生徒・実際の送受信なし</span></div>
<main id="main" class="page"></main>
<nav class="nav" aria-label="メニュー"><button data-tab="home" onclick="navigate('home')"><span>⌂</span>ホーム</button><button data-tab="contact" onclick="navigate('contact')"><span>✉</span>先生に連絡</button><button data-tab="settings" onclick="navigate('settings')"><span>⚙</span>設定</button></nav>
</div>
<script>
'use strict';
const DEMO=[{id:'s1',name:'田中 花子',grade:'中学1年',status:'在室中',time:'16:20',mark:'最終入室',symbol:'✿'},{id:'s2',name:'田中 太郎',grade:'小学6年',status:'外出中',time:'17:30',mark:'外出開始',symbol:'✧'}];
const KEY='manabi_parent_demo_v1';
const blank=()=>({screen:'home',registered:true,guardian:'田中',children:['s1','s2'],category:'欠席',target:'s1',messages:[],notify:true,requestName:'',requestGrade:'中学1年',guardianDraft:''});
let state=blank();try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')state={...state,...s,screen:'home'}}catch(e){}
const main=document.getElementById('main');
function escapeHTML(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function navigate(tab){state.screen=tab;render();window.scrollTo({top:0,behavior:'instant'})}
function toast(msg){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2800)}
function statusClass(s){return ({'在室中':'present','外出中':'away','未到着':'late','退室済み':'gone'})[s]||'unknown'}
function studentCards(){const children=DEMO.filter(s=>state.children.includes(s.id));if(!children.length)return '<div class="card empty">承認済みのお子さまがいません。<br>追加申請の承認後に表示されます。</div>';return children.map(s=>`<article class="card student"><div class="student-head"><div class="avatar" aria-hidden="true">${s.symbol}</div><div><div class="name">${escapeHTML(s.name)}</div><div class="grade">${escapeHTML(s.grade)}</div></div><div class="status ${statusClass(s.status)}">● ${s.status}</div></div><div class="student-foot"><span>${escapeHTML(s.mark)} ${escapeHTML(s.time)}</span><span>先生が記録した状態</span></div></article>`).join('')}
function home(){return `<div class="intro"><span class="eyebrow">PARENT HOME</span><h2>こんにちは、保護者さま</h2><p>お子さまの様子を、いつでもひと目で。</p></div><div class="section-head"><h3>お子さまの在室状況</h3><small>${state.children.length}人を表示</small></div>${studentCards()}<p class="muted" style="margin:3px 2px 0">※ 状況は先生が最後に記録した内容です。リアルタイムの位置情報ではありません。</p><div style="margin-top:24px"><button class="primary wide" onclick="navigate('contact')">✉　先生に連絡する</button></div><div class="section-head"><h3>お知らせ</h3></div><div class="notice"><div class="noticeIcon">✿</div><div><b>まなび管理室へようこそ</b><p>この画面は保護者用のサンプルです。</p></div></div><div class="section-head"><h3>お子さまの追加</h3></div><button class="secondary wide" onclick="navigate('apply')">＋　お子さまを追加申請する</button>`}
function consultationMessages(){const own=state.messages.filter(m=>m.target===state.target&&m.category==='相談');const transcript=[{sender:'teacher',text:'こんにちは。ご相談はこちらで受け付けています。気になることがあれば、いつでもお送りください。',time:'先生からのご案内（サンプル）'},...own];return transcript.map(m=>`<div class="chat-line ${m.sender==='teacher'?'their-line':'mine-line'}"><span class="chat-who">${m.sender==='teacher'?'先生':'保護者'}</span><div class="chat-bubble">${escapeHTML(m.text)}</div><span class="chat-meta">${escapeHTML(m.time)}</span></div>`).join('')}
function contact(){const limit=state.category==='相談'?400:150;const targetOptions=DEMO.filter(s=>state.children.includes(s.id));const options=targetOptions.map(s=>`<option value="${s.id}" ${state.target===s.id?'selected':''}>${escapeHTML(s.name)}</option>`).join('');const head=`<div class="eyebrow">CONTACT</div><h1 class="title">先生に連絡する</h1><p class="lead">連絡したいお子さまと内容を選んでください。</p><div class="card stack" style="margin-bottom:16px"><div><label class="label" for="target">対象のお子さま</label><select class="field" id="target" onchange="changeTarget(this.value)">${options}</select></div><div><div class="label">連絡の種類</div><div class="pillrow">${['欠席','遅刻','早退','相談'].map(c=>`<button class="pill ${state.category===c?'active':''}" onclick="changeCategory('${c}')">${c}</button>`).join('')}</div></div></div>`;
if(state.category==='相談')return head+`<div class="chat-header"><b>✉ 先生との相談トーク</b><span class="chip">デモ</span></div><div id="chatStream" class="chat-stream" aria-label="相談のトーク履歴">${consultationMessages()}</div><div class="chat-compose"><label class="label" for="msg">返信を書く</label><textarea id="msg" maxlength="400" oninput="updateCount()" placeholder="メッセージを入力…"></textarea><div class="chat-compose-footer"><span id="count" class="counter">0 / 400文字</span><button class="primary" onclick="sendDemo()">送信 ↗</button></div></div><p class="chat-note">※ 先生の返答は表示見本です。実際の送信・受信・同期はまだ行われません。相談は1通400文字まで、何通でも送れます。</p>`;
const messages=state.messages.filter(m=>m.target===state.target&&m.category!=='相談');return head+`<div class="card stack"><div><label class="label" for="msg">${state.category}の連絡内容 <span class="tiny" style="font-weight:400;color:#967c8a">（150文字まで・何通でも送信可）</span></label><textarea id="msg" class="field" rows="4" maxlength="150" oninput="updateCount()" placeholder="例：本日はお休みします。よろしくお願いします。"></textarea><div id="count" class="counter">0 / 150文字</div></div><button class="primary wide" onclick="sendDemo()" ${targetOptions.length?'':'disabled'}>連絡を送信（デモ）</button><p class="muted" style="margin:0">現在は送信テストです。先生のPCには届きません。</p></div><div class="section-head"><h3>このお子さまの送信履歴</h3></div>${messages.length?messages.slice().reverse().map(m=>`<div class="message mine"><span class="chip">${escapeHTML(m.category)}</span><div style="margin-top:7px">${escapeHTML(m.text)}</div><time>${escapeHTML(m.time)} · デモ送信</time></div>`).join(''):'<div class="card empty">まだメッセージはありません。</div>'}`}
function changeCategory(c){state.category=c;save();render()}
function changeTarget(id){state.target=id;save();render()}
function updateCount(){const a=document.getElementById('msg');const b=document.getElementById('count');if(a&&b)b.textContent=a.value.length+' / '+a.maxLength+'文字'}
function sendDemo(){const a=document.getElementById('msg');if(!a)return;const text=a.value.trim();if(!text){toast('メッセージを入力してください');return}const limit=state.category==='相談'?400:150;if(text.length>limit){toast('文字数の上限を超えています');return}if(!state.children.includes(state.target)){toast('お子さまを選んでください');return}state.messages.push({target:state.target,category:state.category,sender:'parent',text,time:new Date().toLocaleString('ja-JP')});save();render();if(state.category==='相談'){const box=document.getElementById('chatStream');if(box)box.scrollTop=box.scrollHeight}toast('デモ履歴に保存しました（実際には送信されません）')}
function settings(){return `<div class="eyebrow">SETTINGS</div><h1 class="title">設定・登録情報</h1><p class="lead">ご家族の登録情報や画面表示を確認できます。</p><div class="card"><div class="row"><b>登録済みのお子さま</b><span class="chip">デモ</span></div><hr class="divider">${DEMO.filter(s=>state.children.includes(s.id)).map(s=>`<div class="row" style="margin:10px 0"><span>${escapeHTML(s.name)} <small class="muted">${escapeHTML(s.grade)}</small></span><span class="status present" style="font-size:11px">承認済み（例）</span></div>`).join('')}<button class="secondary wide" style="margin-top:14px" onclick="navigate('apply')">＋ お子さまの追加申請</button></div><div class="section-head"><h3>画面設定</h3></div><div class="card"><div class="toggle"><div><b>お知らせ表示</b><div class="muted tiny">ホームでお知らせを確認</div></div><button class="switch ${state.notify?'on':''}" role="switch" aria-checked="${state.notify}" aria-label="お知らせ表示" onclick="state.notify=!state.notify;save();render()"><i></i></button></div><div class="muted" style="padding-top:13px">※ この設定はデモ用です。プッシュ通知は未実装です。</div></div><div style="margin-top:24px"><button class="plain wide" onclick="if(confirm('この端末のデモの送信履歴を消去しますか？')){state.messages=[];save();render();toast('デモ履歴を消去しました')}">デモの送信履歴を消去</button></div>`}
function apply(){return `<div class="eyebrow">CHILD REGISTRATION</div><h1 class="title">お子さまの追加申請</h1><p class="lead">本番では保護者のお名前とお子さまのお名前で申請し、先生が確認・承認します。</p><div class="info">🌷 今は画面の動作確認用です。入力内容は先生には届かず、承認処理も行われません。実際の個人情報は入力しないでください。</div><div class="card stack"><div><label class="label" for="guardian">保護者のお名前（架空名）</label><input class="field" id="guardian" placeholder="例：田中 保護者" maxlength="40"></div><div><label class="label" for="child">お子さまのお名前（架空名）</label><input class="field" id="child" placeholder="例：田中 花子" maxlength="40"></div><div><label class="label" for="grade">学年</label><select class="field" id="grade">${['小学1年','小学2年','小学3年','小学4年','小学5年','小学6年','中学1年','中学2年','中学3年'].map(s=>`<option>${s}</option>`).join('')}</select></div><button class="primary wide" onclick="applyDemo()">申請の流れを試す</button><button class="plain wide" onclick="navigate('home')">ホームに戻る</button></div>`}
function applyDemo(){const guardian=document.getElementById('guardian').value.trim(),child=document.getElementById('child').value.trim();if(!guardian||!child){toast('保護者名とお子さまの名前を入力してください');return}state.requestName=child;state.requestGrade=document.getElementById('grade').value;state.guardianDraft=guardian;state.screen='pending';save();render()}
function pending(){return `<div style="text-align:center;padding-top:50px"><div style="font-size:55px;color:#c47094">✉</div><h1 class="title">申請画面のデモ完了</h1><p class="lead">実際の申請は送信されていません。<br>本番では先生の手動承認後に、お子さまの情報が表示されます。</p><div class="card" style="text-align:left"><b>入力内容（サンプル）</b><p class="muted">保護者：${escapeHTML(state.guardianDraft)}<br>お子さま：${escapeHTML(state.requestName)}<br>学年：${escapeHTML(state.requestGrade)}</p><span class="chip">未送信・デモ</span></div><button class="primary wide" style="margin-top:20px" onclick="navigate('home')">ホームに戻る</button></div>`}
function render(){main.innerHTML=({home,contact,settings,apply,pending}[state.screen]||home)();document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.screen);b.setAttribute('aria-current',b.dataset.tab===state.screen?'page':'false')});const notices=document.querySelector('.notice');if(notices&&!state.notify)notices.classList.add('hidden')}
render();
</script>
</body></html>
